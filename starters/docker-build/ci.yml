# CI starter: Dockerfile builds (no push).
# Copy to .github/workflows/ci.yml. Adjust `branches` to the repo's default branch.
# The `uses:` ref is pinned to a commit SHA; see README "Bumping the pinned SHA".
name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docker-build:
    uses: Rumi-Shamz/ci-templates/.github/workflows/docker-build.yml@__CI_TEMPLATES_SHA__ # v1
    # with:
    #   context: "."
    #   file: ""                 # default <context>/Dockerfile
