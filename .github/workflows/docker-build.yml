# Reusable workflow: prove the Dockerfile builds (no push, no registry login).
name: docker-build

on:
  workflow_call:
    inputs:
      context:
        description: "Docker build context (relative to the repo root)."
        type: string
        default: "."
      file:
        description: "Dockerfile path relative to the repo root. Empty = <context>/Dockerfile."
        type: string
        default: ""
      timeout-minutes:
        description: "Job timeout."
        type: number
        default: 30

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file != '' && inputs.file || format('{0}/Dockerfile', inputs.context) }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
